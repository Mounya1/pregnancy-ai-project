# The Flutter template ships -Xmx8G -XX:MaxMetaspaceSize=4G, which assumes a
# 32GB workstation. On an 8GB machine the daemon dies with "Gradle build daemon
# disappeared unexpectedly" before it compiles anything. These values leave
# room for Windows, WSL, and the Flutter tool itself.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# The Kotlin compiler forks its own JVM; cap it too or it repeats the problem.
kotlin.daemon.jvmargs=-Xmx1024m
# Fewer concurrent workers means fewer JVMs competing for the same RAM.
org.gradle.workers.max=2
org.gradle.parallel=false
# Android Studio bundles JBR 25, which Gradle 8.11 rejects (it fails with a
# bare "25.0.2"). Point at the JDK 23 already installed on this machine.
org.gradle.java.home=C:/Program Files/Java/jdk-23
android.useAndroidX=true
# android.newDsl / android.builtInKotlin were AGP 9 template flags. On AGP 8
# the Kotlin plugin is applied explicitly in app/build.gradle.kts instead.
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
