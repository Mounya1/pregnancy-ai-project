services:
  - type: web
    name: pregnancy-ai-backend
    env: docker
    plan: free
    envVars:
      - key: OPENAI_API_KEY
        sync: false   # set this manually in the Render dashboard, never commit it
      - key: CHAT_MODEL
        value: gpt-4o
      - key: VISION_MODEL
        value: gpt-4o
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
